[build]
  command = "cd .. && pnpm install --frozen-lockfile && pnpm setup:ci && pnpm build:docs"
  publish = "build"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../storybook/ ../packages/admin/"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"

# Keep inbound links working after the Comet to Dextinity rename moved these pages.
[[redirects]]
  from = "/docs/comet-core-development/*"
  to = "/docs/dextinity-core-development/:splat"
  status = 301

[[redirects]]
  from = "/docs/guides/generate-grid-form-views/integrate-admin-generator-datagrid-into-comet-application"
  to = "/docs/guides/generate-grid-form-views/integrate-admin-generator-datagrid-into-dextinity-application"
  status = 301
