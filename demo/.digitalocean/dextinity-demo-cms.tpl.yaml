alerts:
    - rule: DEPLOYMENT_FAILED
    - rule: DOMAIN_FAILED
domains:
    - domain: admin.demo.digitalocean.dextinity.com
      type: PRIMARY
ingress:
    rules:
        - component:
              name: admin
          match:
              path:
                  prefix: /admin-do-not-use
        - component:
              name: oauth2-proxy
          match:
              path:
                  prefix: /
        - component:
              name: api
          match:
              path:
                  prefix: /public-api
name: dextinity-demo-cms
region: fra
services:
    - dockerfile_path: demo/.digitalocean/Api.Dockerfile
      source_dir: /
      github:
          branch: main
          deploy_on_push: false
          repo: vivid-planet/dextinity
      envs:
          - key: SERVER_HOST
            scope: RUN_TIME
            value: "0.0.0.0"
          - key: API_PORT
            scope: RUN_TIME
            value: "4000"
          - key: HELM_RELEASE
            scope: RUN_TIME
            value: dextinity-demo
          # Required in production, but any non-empty value makes the API reject every request that doesn't come through a CDN
          - key: CDN_ORIGIN_CHECK_SECRET
            scope: RUN_TIME
            value: ""
          - key: POSTGRESQL_HOST
            scope: RUN_TIME
            value: db-postgresql-fra1-74967-do-user-15310175-0.l.db.ondigitalocean.com
          - key: POSTGRESQL_PORT
            scope: RUN_TIME
            value: "25060"
          - key: POSTGRESQL_DB
            scope: RUN_TIME
            value: demo
          - key: POSTGRESQL_USER
            scope: RUN_TIME
            value: demo
          - key: POSTGRESQL_PWD
            scope: RUN_TIME
            type: SECRET
            value: ${POSTGRESQL_PWD_BASE64}
          - key: POSTGRESQL_USE_SSL
            scope: RUN_TIME
            value: "true"
          # The database cluster's certificate is signed by its own CA
          - key: NODE_EXTRA_CA_CERTS
            scope: RUN_TIME
            value: /opt/app-root/src/demo/.digitalocean/digitalocean-postgresql-ca.crt
          - key: API_URL
            scope: RUN_TIME
            value: https://admin.demo.digitalocean.dextinity.com/public-api/api
          - key: ADMIN_URL
            scope: RUN_TIME
            value: https://admin.demo.digitalocean.dextinity.com
          - key: CORS_ALLOWED_ORIGIN
            scope: RUN_TIME
            value: demo\.digitalocean\.dextinity\.com
          - key: IDP_CLIENT_ID
            scope: RUN_TIME
            value: ${IDP_CLIENT_ID}
          - key: IDP_JWKS_URI
            scope: RUN_TIME
            value: https://login.vivid-planet.cloud/oauth/v2/keys
          - key: IDP_END_SESSION_ENDPOINT
            scope: RUN_TIME
            value: https://login.vivid-planet.cloud/oidc/v1/end_session
          - key: POST_LOGOUT_REDIRECT_URI
            scope: RUN_TIME
            value: https://admin.demo.digitalocean.dextinity.com/oauth2/sign_out?rd=%2F
          - key: BASIC_AUTH_SYSTEM_USER_PASSWORD
            scope: RUN_TIME
            type: SECRET
            value: ${API_BASIC_AUTH_SYSTEM_USER_PASSWORD}
          - key: SITE_PREVIEW_SECRET
            scope: RUN_TIME
            type: SECRET
            value: ${SITE_PREVIEW_SECRET}
          - key: PRIVATE_SITE_CONFIGS
            scope: RUN_TIME
            value: "{{ site://configs/private/digitalocean }}"
          - key: IMGPROXY_URL
            scope: RUN_TIME
            value: https://imgproxy.demo.digitalocean.dextinity.com
          - key: IMGPROXY_KEY
            scope: RUN_TIME
            type: SECRET
            value: ${IMGPROXY_KEY}
          - key: IMGPROXY_SALT
            scope: RUN_TIME
            type: SECRET
            value: ${IMGPROXY_SALT}
          - key: DAM_SECRET
            scope: RUN_TIME
            type: SECRET
            value: ${DAM_SECRET}
          - key: FILE_UPLOADS_DOWNLOAD_SECRET
            scope: RUN_TIME
            type: SECRET
            value: ${FILE_UPLOADS_DOWNLOAD_SECRET}
          - key: BLOB_STORAGE_DRIVER
            scope: RUN_TIME
            value: s3
          - key: BLOB_STORAGE_DIRECTORY_PREFIX
            scope: RUN_TIME
            value: demo
          - key: S3_REGION
            scope: RUN_TIME
            value: fra1
          - key: S3_ENDPOINT
            scope: RUN_TIME
            value: https://fra1.digitaloceanspaces.com
          - key: S3_BUCKET
            scope: RUN_TIME
            value: dextinity-demo
          - key: S3_ACCESS_KEY_ID
            scope: RUN_TIME
            type: SECRET
            value: ${S3_ACCESS_KEY_ID}
          - key: S3_SECRET_ACCESS_KEY
            scope: RUN_TIME
            type: SECRET
            value: ${S3_SECRET_ACCESS_KEY}
          - key: MAILER_HOST
            scope: RUN_TIME
            value: mailpit
          - key: MAILER_PORT
            scope: RUN_TIME
            value: "1025"
          # The API requires these, but the Brevo features aren't used on this deployment
          - key: BREVO_API_KEY
            scope: RUN_TIME
            value: not-used
          - key: BREVO_ECG_RTR_LIST_API_KEY
            scope: RUN_TIME
            value: not-used
          - key: BREVO_CAMPAIGN_BASIC_AUTH_USERNAME
            scope: RUN_TIME
            value: brevo
          - key: BREVO_CAMPAIGN_BASIC_AUTH_PASSWORD
            scope: RUN_TIME
            value: not-used
      health_check:
          http_path: /api/status/liveness
      http_port: 4000
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      name: api
    - envs:
          - key: OAUTH2_PROXY_CLIENT_ID
            scope: RUN_TIME
            value: ${IDP_CLIENT_ID}
          - key: OAUTH2_PROXY_CLIENT_SECRET
            scope: RUN_TIME
            type: SECRET
            value: ${OAUTH2_PROXY_CLIENT_SECRET}
          - key: OAUTH2_PROXY_COOKIE_SECRET
            scope: RUN_TIME
            type: SECRET
            value: ${OAUTH2_PROXY_COOKIE_SECRET}
          # Provider
          - key: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
            scope: RUN_TIME
            value: S256
          - key: OAUTH2_PROXY_OIDC_ISSUER_URL
            scope: RUN_TIME
            value: https://login.vivid-planet.cloud
          - key: OAUTH2_PROXY_PROVIDER
            scope: RUN_TIME
            value: oidc
          - key: OAUTH2_PROXY_SCOPE
            scope: RUN_TIME
            value: openid profile email offline_access
          # Cookie, shared with the site's oauth2-proxy so one login covers admin, site and preview
          - key: OAUTH2_PROXY_COOKIE_DOMAINS
            scope: RUN_TIME
            value: .demo.digitalocean.dextinity.com
          - key: OAUTH2_PROXY_COOKIE_SAMESITE
            scope: RUN_TIME
            value: lax
          - key: OAUTH2_PROXY_COOKIE_REFRESH
            scope: RUN_TIME
            value: 55m
          # Header
          - key: OAUTH2_PROXY_PASS_ACCESS_TOKEN
            scope: RUN_TIME
            value: "true"
          - key: OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER
            scope: RUN_TIME
            value: "true"
          # Logging
          - key: OAUTH2_PROXY_AUTH_LOGGING
            scope: RUN_TIME
            value: "true"
          - key: OAUTH2_PROXY_REQUEST_LOGGING
            scope: RUN_TIME
            value: "false"
          - key: OAUTH2_PROXY_SILENCE_PING_LOGGING
            scope: RUN_TIME
            value: "true"
          - key: OAUTH2_PROXY_STANDARD_LOGGING
            scope: RUN_TIME
            value: "false"
          # Proxy
          - key: OAUTH2_PROXY_API_ROUTES
            scope: RUN_TIME
            value: /api
          - key: OAUTH2_PROXY_EMAIL_DOMAINS
            scope: RUN_TIME
            value: vivid-planet.com
          - key: OAUTH2_PROXY_SKIP_AUTH_PREFLIGHT
            scope: RUN_TIME
            value: "true"
          - key: OAUTH2_PROXY_SKIP_AUTH_ROUTES
            scope: RUN_TIME
            value: "^/api/status/"
          - key: OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS
            scope: RUN_TIME
            value: "true"
          - key: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
            scope: RUN_TIME
            value: "true"
          - key: OAUTH2_PROXY_WHITELIST_DOMAINS
            scope: RUN_TIME
            value: login.vivid-planet.cloud,.demo.digitalocean.dextinity.com
          - key: OAUTH2_PROXY_HTTP_ADDRESS
            scope: RUN_TIME
            value: 0.0.0.0:4180
          # Upstream
          - key: OAUTH2_PROXY_UPSTREAMS
            scope: RUN_TIME
            value: http://admin:80,http://api:80/api/,http://mailpit:8025/mailpit/
      http_port: 4180
      image:
          registry: dkarnutsch
          registry_type: DOCKER_HUB
          repository: oauth2-proxy
          tag: latest
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      name: oauth2-proxy
    - dockerfile_path: demo/.digitalocean/Admin.Dockerfile
      source_dir: /
      github:
          branch: main
          deploy_on_push: false
          repo: vivid-planet/dextinity
      envs:
          - key: SERVER_HOST
            scope: RUN_TIME
            value: "0.0.0.0"
          - key: ADMIN_PORT
            scope: RUN_TIME
            value: "3000"
          - key: ADMIN_URL
            scope: RUN_TIME
            value: https://admin.demo.digitalocean.dextinity.com
          - key: API_URL_INTERNAL
            scope: RUN_TIME
            value: http://api:80/api
          - key: PREVIEW_URL
            scope: RUN_TIME
            value: https://preview.demo.digitalocean.dextinity.com
          - key: PUBLIC_SITE_CONFIGS
            scope: RUN_TIME
            value: "{{ site://configs/public/digitalocean }}"
      http_port: 3000
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      name: admin
    # Catches every mail the demo sends; its web UI is at /mailpit behind the oauth2-proxy
    - envs:
          - key: MP_WEBROOT
            scope: RUN_TIME
            value: /mailpit
      image:
          registry: axllent
          registry_type: DOCKER_HUB
          repository: mailpit
          tag: latest
      # Without an http_port, App Platform would check the default port 8080
      health_check:
          port: 8025
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      internal_ports:
          - 1025
          - 8025
      name: mailpit
