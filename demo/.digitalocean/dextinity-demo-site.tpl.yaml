alerts:
    - rule: DEPLOYMENT_FAILED
    - rule: DOMAIN_FAILED
features:
    - buildpack-stack=ubuntu-22
domains:
    - domain: demo.digitalocean.dextinity.com
      type: PRIMARY
    - domain: secondary.demo.digitalocean.dextinity.com
      type: ALIAS
    - domain: preview.demo.digitalocean.dextinity.com
      type: ALIAS
ingress:
    rules:
        - component:
              name: site
          match:
              path:
                  prefix: /
name: dextinity-demo-site
region: fra
services:
    # Next.js loads the contact form route while building, which requires the mailer, contact form and reCAPTCHA variables. They're read again at runtime.
    # The static assets are uploaded at the end of the build, before App Platform replaces the running instance, so that the storage holds the files of every deployed build.
    - build_command: |-
          CI=true node copy-project-files.js &&
          pnpm --filter "dextinity-demo-site^..." run build &&
          ./demo/site/intl-update.sh &&
          MAILER_HOST=build MAILER_PORT=25 CONTACT_FORM_FROM_EMAIL=build@example.com CONTACT_FORM_TO_EMAIL=build@example.com RECAPTCHA_SERVICE_ACCOUNT=eyJwcm9qZWN0X2lkIjoiYnVpbGQifQ== pnpm --filter dextinity-demo-site run build &&
          pnpm --filter dextinity-demo-site run upload-static-assets
      environment_slug: node-js
      run_command: cd demo/site && node dist/server.js
      source_dir: /
      github:
          branch: ${DEPLOY_BRANCH}
          deploy_on_push: false
          repo: vivid-planet/dextinity
      envs:
          # Only available while building, so the running site has no write access to the storage
          - key: STATIC_ASSETS_STORAGE_DRIVER
            scope: BUILD_TIME
            value: s3
          - key: STATIC_ASSETS_STORAGE_PREFIX
            scope: BUILD_TIME
            value: site/_next/static
          - key: STATIC_ASSETS_STORAGE_S3_REGION
            scope: BUILD_TIME
            value: fra1
          - key: STATIC_ASSETS_STORAGE_S3_ENDPOINT
            scope: BUILD_TIME
            value: https://fra1.digitaloceanspaces.com
          - key: STATIC_ASSETS_STORAGE_S3_BUCKET
            scope: BUILD_TIME
            value: dextinity-demo
          - key: STATIC_ASSETS_STORAGE_S3_PUBLIC_READ
            scope: BUILD_TIME
            value: "true"
          - key: STATIC_ASSETS_STORAGE_S3_ACCESS_KEY_ID
            scope: BUILD_TIME
            type: SECRET
            value: ${S3_ACCESS_KEY_ID}
          - key: STATIC_ASSETS_STORAGE_S3_SECRET_ACCESS_KEY
            scope: BUILD_TIME
            type: SECRET
            value: ${S3_SECRET_ACCESS_KEY}
          - key: ASSET_PREFIX
            scope: RUN_AND_BUILD_TIME
            value: https://dextinity-demo.fra1.digitaloceanspaces.com/site
          - key: SERVER_HOST
            scope: RUN_TIME
            value: "0.0.0.0"
          - key: SITE_PORT
            scope: RUN_TIME
            value: "3000"
          - key: ADMIN_URL
            scope: RUN_TIME
            value: https://admin.demo.digitalocean.dextinity.com
          - key: API_URL_INTERNAL
            scope: RUN_TIME
            value: https://admin.demo.digitalocean.dextinity.com/public-api/api
          - key: API_BASIC_AUTH_SYSTEM_USER_PASSWORD
            scope: RUN_TIME
            type: SECRET
            value: ${API_BASIC_AUTH_SYSTEM_USER_PASSWORD}
          - key: PUBLIC_SITE_CONFIGS
            scope: RUN_TIME
            value: "{{ site://configs/public/digitalocean }}"
          - key: PREVIEW_DOMAIN
            scope: RUN_TIME
            value: preview.demo.digitalocean.dextinity.com
      http_port: 3000
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      name: site
