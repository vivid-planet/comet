#cloud-config
package_update: true
packages:
    - docker.io
    - docker-compose-v2
    - git
runcmd:
    # Building the demo needs more memory than the Droplet has
    - fallocate -l 4G /swapfile
    - chmod 600 /swapfile
    - mkswap /swapfile
    - swapon /swapfile
    - echo "/swapfile none swap sw 0 0" >> /etc/fstab
