name: Chromatic

on:
    pull_request:
    push:
        branches:
            - main
            - next

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - run: echo "${{ github.actor }}"

            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/setup

            - run: pnpm --recursive --filter '@dextinity/*admin*' --filter '@dextinity/mail-react' --filter '@dextinity/eslint-plugin' --filter '@dextinity/cli' run build

            - name: Publish dextinity-admin to Chromatic
              uses: chromaui/action@v18
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_ADMIN }}
                  workingDir: packages/admin/admin

            - name: Publish dextinity-cms-admin to Chromatic
              uses: chromaui/action@v18
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_CMS_ADMIN }}
                  workingDir: packages/admin/cms-admin

            - name: Publish dextinity-mail-react to Chromatic
              uses: chromaui/action@v18
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_MAIL_REACT }}
                  workingDir: packages/mail-react

    ui:
        name: UI
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/setup
              with:
                  setup-ci: "false"

            - name: Publish dextinity-ui to Chromatic
              run: |
                  if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
                      echo "::notice::Skipped: the repository has no CHROMATIC_PROJECT_TOKEN_UI secret yet."
                      exit 0
                  fi
                  pnpm --filter @dextinity/ui run chromatic
              env:
                  CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN_UI }}
